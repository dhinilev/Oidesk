name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show the error
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -n -i -E "error:|failed|traceback|no matching|could not" build.log | grep -v "Wmacro" | tail -n 25
          echo "=== LAST 40 LINES ==="
          tail -n 40 build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OI-Desk-APK
          path: bin/*.apk
