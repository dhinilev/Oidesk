name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv
      - name: Build APK
        run: |
          java -version
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show the error
        if: failure()
        run: |
          echo "=== WHAT WENT WRONG ==="
          grep -n -A 14 "What went wrong" build.log | head -n 45
          echo "=== JAVA ==="
          grep -n -i "java" build.log | tail -n 8
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OI-Desk-APK
          path: bin/*.apk
